<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5G 时代下的绿色校园物流 — 竞赛方案 | 管曼玲</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      /* A2 @ 200 DPI：420mm × 594mm */
      --page-width: 420mm;
      --page-height: 594mm;
    }

    body {
      margin: 0;
      padding: 1.5rem 0 2.5rem;
      background: #0b1220;
      color: #e2e8f0;
      font-family: Inter, system-ui, sans-serif;
    }

    .proposal-header {
      max-width: var(--page-width);
      margin: 0 auto 1rem;
      padding: 0 1rem;
    }

    .proposal-header h1 {
      margin: 0 0 0.35rem;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .proposal-header p {
      margin: 0;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .proposal-viewer {
      overflow-x: auto;
      padding: 0 1rem 1rem;
    }

    .proposal-page {
      width: var(--page-width);
      height: var(--page-height);
      margin: 0 auto 1.5rem;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 18px 48px rgba(2, 6, 23, 0.45);
      overflow: hidden;
    }

    .proposal-page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: auto;
    }

    @media (max-width: 768px) {
      :root {
        --page-width: 100%;
        --page-height: auto;
      }

      body {
        padding: 1rem 0 2rem;
      }

      .proposal-header {
        padding: 0 0.85rem;
      }

      .proposal-header h1 {
        font-size: 1rem;
        line-height: 1.45;
      }

      .proposal-header p {
        font-size: 0.82rem;
      }

      .proposal-viewer {
        padding: 0 0.85rem 1rem;
        -webkit-overflow-scrolling: touch;
      }

      .proposal-page {
        width: 100%;
        height: auto;
        aspect-ratio: 420 / 594;
        margin: 0 0 1rem;
      }

      .proposal-page img {
        width: 100%;
        height: auto;
        object-fit: contain;
      }
    }
  </style>
</head>
<body>
  <div class="proposal-header">
    <h1>5G 时代下的绿色校园物流 — 竞赛方案</h1>
    <p>A2 尺寸 · 200 DPI · 可横向滚动查看细节</p>
  </div>

  <div class="proposal-viewer">
    <figure class="proposal-page">
      <img
        src="img/green-campus-proposal-1.png"
        alt="竞赛方案第 1 页：概念设计、无人车与智慧驿站"
        width="3307"
        height="4677"
      />
    </figure>
    <figure class="proposal-page">
      <img
        src="img/green-campus-proposal-2.png"
        alt="竞赛方案第 2 页：情景模拟、路径规划与 APP 平台"
        width="3307"
        height="4677"
        loading="lazy"
      />
    </figure>
  </div>
</body>
</html>
